services:
  - type: web
    name: smartgarbage
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12"
      - key: RQ_IN_PROCESS_WORKER
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RAZOR_PUBLIC_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: IOT_TELEMETRY_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      # ── Free WhatsApp (Meta Cloud API) — free text replies inside the
      # citizen's 24h service window; no sandbox, no per-number verification.
      - key: WHATSAPP_CLOUD_TOKEN
        sync: false
      - key: WHATSAPP_CLOUD_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # ── Email notifications (Gmail SMTP or Brevo free tier) ──
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USE_TLS
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      # ── Concurrency / stall guard (ops) ──
      # 2 gevent workers fit comfortably in Starter RAM and halve the
      # single-event-loop stall risk: with 1 worker, one blocking call
      # (slow DB roundtrip, DNS, PIL) queues every concurrent request
      # behind it (observed: ~11% of probes stalled 60s on the old
      # -w 1 default). GUNICORN_TIMEOUT kills a wedged request before
      # it can hold a worker hostage.
      - key: GUNICORN_WORKERS
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "120"

  # ───────────────────────────────────────────────────────────────────────
  # DECISION (2026-09-23): the dedicated worker service is DISABLED by design.
  #
  # Render has no free tier for background workers — they start at ~$7/mo
  # (only web services, Key Value and Postgres can run free). This block
  # declared plan: starter, and with REDIS_URL unset it printed
  # "background worker disabled" and exited: a paid no-op with a bill attached.
  #
  # The queue still works for Rs 0 without it. wsgi.py starts an in-process RQ
  # worker (RQ_IN_PROCESS_WORKER, ON by default) whenever REDIS_URL is set, so
  # setting REDIS_URL alone — e.g. a free Render Key Value (25 MB) instance —
  # moves OTP/status/receipt sends off the request thread with no extra
  # service and no extra cost.
  #
  # Re-enable ONLY to run the worker as its own process (still needs
  # REDIS_URL, and costs ~$7/mo). If you do: uncomment the block below AND set
  # RQ_IN_PROCESS_WORKER=false on the web service, otherwise both processes
  # would execute the same jobs twice.
  #
  # Whatever you choose: Redis WITHOUT a consuming worker silently starves
  # jobs (queued, never sent — mail disappears while the site looks healthy).
  # /health reports queue.workers and now warns when it is 0.
  #
  # - type: worker
  #   name: smartgarbage-worker
  #   runtime: docker
  #   plan: starter
  #   region: oregon
  #   branch: main
  #   dockerfilePath: ./Dockerfile
  #   envVars:
  #     - key: RENDER
  #       value: "true"
  #     - key: RENDER_WORKER
  #       value: "true"
  #     - key: RQ_IN_PROCESS_WORKER
  #       value: "false"
  #     - key: SECRET_KEY
  #       sync: false
  #     - key: DATABASE_URL
  #       sync: false
  #     - key: SUPABASE_URL
  #       sync: false
  #     - key: SUPABASE_SERVICE_ROLE_KEY
  #       sync: false
  #     - key: IOT_TELEMETRY_SECRET
  #       sync: false
  #     - key: REDIS_URL
  #       sync: false
  #     - key: WHATSAPP_CLOUD_TOKEN
  #       sync: false
  #     - key: WHATSAPP_CLOUD_PHONE_NUMBER_ID
  #       sync: false
  #     - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
  #       sync: false
  #     - key: WHATSAPP_APP_SECRET
  #       sync: false
  #     - key: TWILIO_ACCOUNT_SID
  #       sync: false
  #     - key: TWILIO_AUTH_TOKEN
  #       sync: false
  #     - key: TWILIO_FROM_NUMBER
  #       sync: false
  #     - key: TWILIO_WHATSAPP_NUMBER
  #       sync: false
  #     - key: RAZORPAY_KEY_ID
  #       sync: false
  #     - key: RAZORPAY_KEY_SECRET
  #       sync: false
  #     - key: RAZORPAY_WEBHOOK_SECRET
  #       sync: false
  #     # ── Email notifications (Gmail SMTP or Brevo free tier) ──
  #     - key: MAIL_SERVER
  #       sync: false
  #     - key: MAIL_PORT
  #       sync: false
  #     - key: MAIL_USE_TLS
  #       sync: false
  #     - key: MAIL_USERNAME
  #       sync: false
  #     - key: MAIL_PASSWORD
  #       sync: false
  #     - key: MAIL_DEFAULT_SENDER
  #       sync: false

# Supabase replaces Render's managed Postgres.
# DATABASE_URL is set in the Render dashboard, pointing at the Supabase
# connection pooler (port 5432).
