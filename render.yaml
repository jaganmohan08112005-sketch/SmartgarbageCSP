services:
  - type: web
    name: smartgarbage
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RAZOR_PUBLIC_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: IOT_TELEMETRY_SECRET
        sync: false

# NOTE: Supabase replaces Render's managed Postgres.
# Create a Supabase project, copy the "Connection pooler" (port 5432) URI,
# and paste it as DATABASE_URL in Render env vars.
# Remove any `databases:` block below once Supabase is live.
