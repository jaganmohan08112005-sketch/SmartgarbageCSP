services:
  - type: web
    name: smartgarbage
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12"
      - key: RQ_IN_PROCESS_WORKER
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RAZOR_PUBLIC_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: IOT_TELEMETRY_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      # ── Free WhatsApp (Meta Cloud API) — free text replies inside the
      # citizen's 24h service window; no sandbox, no per-number verification.
      - key: WHATSAPP_CLOUD_TOKEN
        sync: false
      - key: WHATSAPP_CLOUD_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # ── Email notifications (Gmail SMTP or Brevo free tier) ──
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USE_TLS
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      # ── Concurrency / stall guard (ops) ──
      # 2 gevent workers fit comfortably in Starter RAM and halve the
      # single-event-loop stall risk: with 1 worker, one blocking call
      # (slow DB roundtrip, DNS, PIL) queues every concurrent request
      # behind it (observed: ~11% of probes stalled 60s on the old
      # -w 1 default). GUNICORN_TIMEOUT kills a wedged request before
      # it can hold a worker hostage.
      - key: GUNICORN_WORKERS
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "120"

  # Dedicated RQ queue worker. The Dockerfile's CMD runs `python worker.py`
  # when RENDER_WORKER=true, so background jobs (SMS/WhatsApp, webhook
  # dispatch, exports, PAYT dunning, retention/sweeps) execute in production.
  # Note: if this service was created as a native-Python service (not from
  # this blueprint), Render ignores render.yaml entirely — the web process
  # then runs the queue in-process instead (see wsgi.py's
  # RQ_IN_PROCESS_WORKER fallback, on by default when REDIS_URL is set).
  - type: worker
    name: smartgarbage-worker
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: RENDER
        value: "true"
      - key: RENDER_WORKER
        value: "true"
      - key: RQ_IN_PROCESS_WORKER
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: IOT_TELEMETRY_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WHATSAPP_CLOUD_TOKEN
        sync: false
      - key: WHATSAPP_CLOUD_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # ── Email notifications (Gmail SMTP or Brevo free tier) ──
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USE_TLS
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false

# Supabase replaces Render's managed Postgres.
# DATABASE_URL is set in the Render dashboard, pointing at the Supabase
# connection pooler (port 5432).
