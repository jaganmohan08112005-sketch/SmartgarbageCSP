# fly.toml — SmartGarbage on Fly.io + Supabase
app = "smartgarbage-csp"
primary_region = "iad"  # change to "bom" for Mumbai proximity if needed

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "10000"
  FLASK_ENV = "production"
  # Database & Supabase (set via `fly secrets set`)
  # DATABASE_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SECRET_KEY, etc.

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 100
    hard_limit = 200

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
