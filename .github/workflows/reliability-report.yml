name: Reliability report

# Weekly companion to docs/PHOTO_GATE_RELIABILITY_REPORT.md: queries the prod
# photo_rejection table (the admin panel's data source) for the trailing 7
# days, appends a dated "Weekly snapshot" section to the report, and commits
# it straight to main (docs-only change → CI is near-certain green; a failed
# run leaves main untouched).
#
# Secrets/vars expected (repository or environment level):
#   DATABASE_URL   production Postgres (Supabase) URL — READ-ONLY recommended
#   HEALTH_URL     optional (defaults to prod /health)
#   GH_REPOSITORY  optional; defaults to github.repository
#   GH_TOKEN       optional (use github.token) — follow-up issue fan-out
#                  (the token now has issues:write; a missing repo match is
#                  always a silent no-op and API errors are non-fatal)
#
# Safety properties:
#   - The script is idempotent per ISO week (it skips an already-recorded
#     week), so a retry cannot duplicate sections.
#   - The commit is made with the workflow's own identity — no user data
#     leaves the database except aggregate counts (no photos, no notes).

on:
  schedule:
    # Mondays 03:00 UTC (08:30 IST) — after the weekend, before the workday.
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write   # commit the updated report straight to main
  issues: write     # optional follow-up-issue fan-out (no-op without a match)

concurrency:
  group: reliability-report
  cancel-in-progress: false

jobs:
  weekly-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT-less push protection: use the newer node20 fetch with enough
          # depth for the report file; a merge commit on main is fine.
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (sqlalchemy + psycopg2 + requests — no app stack)
        run: |
          python -m pip install --upgrade pip
          pip install "sqlalchemy>=2.0" psycopg2-binary requests

      - name: Append weekly snapshot to the reliability report
        id: run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HEALTH_URL: https://smartgarbage.onrender.com/health
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not set — SMOKE MODE: skipping the weekly append."
            echo "Add the production DATABASE_URL repository secret to enable real snapshots."
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python scripts/photo_rejection_weekly.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0  # status decided below

      - name: Reflect result in workflow status
        if: always()
        run: |
          code="${{ steps.run.outputs.exit_code }}"
          case "$code" in
            0) echo "✅ weekly snapshot recorded" ;;
            2) echo "::error::DATABASE_URL missing/invalid or app-level failure — report NOT updated"; exit 1 ;;
            *) echo "::error::weekly script failed (exit $code) — report NOT updated"; exit 1 ;;
          esac

      - name: Commit the updated report (docs-only, straight to main)
        id: commit
        run: |
          if git diff --quiet docs/PHOTO_GATE_RELIABILITY_REPORT.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no report change this week (idempotent skip or empty window) — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHOTO_GATE_RELIABILITY_REPORT.md
          git commit -m "docs: weekly reliability snapshot (auto) — $(date -u +%G-W%V)"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          if [ -f weekly_stats.json ]; then
            {
              echo '## Weekly photo-gate reliability snapshot'
              echo '```json'
              cat weekly_stats.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
