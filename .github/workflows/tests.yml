name: tests

# Gate EVERY feature-branch push with the full 359-test suite so a red
# branch is visible before a PR is opened. (main and PRs against main are
# covered by ci.yml; this workflow intentionally ignores main to avoid
# running the suite twice per merged change.)
on:
  push:
    branches-ignore: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg-suite:
    # Same harness as the local run: `python run_pg_suite.py` boots an
    # embedded pgserver Postgres, sets TEST_DATABASE_URL, and invokes pytest
    # sequentially (-n 0) — the fixtures drop/recreate the schema per test.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies (incl. dev-only pgserver harness)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install Playwright browser (tests/qa E2E fixtures)
        run: python -m playwright install --with-deps chromium
      - name: Run full suite against embedded Postgres
        run: |
          # Tee the log so a failure's last lines (pytest's short test
          # summary) are easy to find; PIPESTATUS preserves the runner's exit
          # code, not tee's.
          set -o pipefail
          python run_pg_suite.py -q 2>&1 | tee _test_run.log
      - name: Summarise failures
        if: failure()
        run: tail -n 60 _test_run.log
