name: tests

# Gate EVERY feature-branch push with the full test suite so a red
# branch is visible before a PR is opened. (The suite collects tests/ —
# including tests/test_template_csp.py, the CSP gate on inline handlers and
# un-nonced inline blocks — and ci.yml re-runs that gate by name.) (main and PRs against main are
# covered by ci.yml; this workflow intentionally ignores main to avoid
# running the suite twice per merged change.)
on:
  push:
    branches-ignore: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg-suite:
    # Same harness as the local run: `python run_pg_suite.py` boots an
    # embedded pgserver Postgres, sets TEST_DATABASE_URL, and invokes pytest
    # in parallel — each xdist worker gets its own database (see
    # tests/conftest.py), so the per-test schema drop/recreate is safe.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Mirror pytest.ini's filterwarnings promotion: the deprecated sqlite3
    # implicit datetime/date adapters (Python 3.12+) must surface as errors
    # even if the runner ever bypasses pytest.ini. Message-anchored so
    # unrelated DeprecationWarnings from third-party deps don't fail the
    # build.
    env:
      PYTHONWARNINGS: "error:The default datetime adapter is deprecated:DeprecationWarning,error:The default date adapter is deprecated:DeprecationWarning"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies (incl. dev-only pgserver harness)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install Playwright browser (tests/qa E2E fixtures)
        run: python -m playwright install --with-deps chromium
      - name: Run full suite against embedded Postgres
        run: |
          # Tee the log so a failure's last lines (pytest's short test
          # summary) are easy to find; PIPESTATUS preserves the runner's exit
          # code, not tee's.
          set -o pipefail
          python run_pg_suite.py -q 2>&1 | tee _test_run.log
      - name: Summarise failures
        if: failure()
        run: tail -n 60 _test_run.log
