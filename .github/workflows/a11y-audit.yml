name: Accessibility & Performance Audit

# Runs the Lighthouse + axe accessibility/performance audit against the local
# stack (pgserver + Flask via scripts/run_local_stack.py) and FAILS the build
# when Lighthouse accessibility drops below 100 on any audited page or axe
# reports any WCAG A/AA violation — on the 10 public pages AND on the
# authenticated staff portals (/worker, /admin), which are axe-scanned after a
# real login + MFA against the seeded local stack. This keeps the target-size /
# in-text-link / contrast / unnamed-control regressions from silently
# returning.
#
# axe reports color-contrast INCOMPLETE wherever it cannot compute a
# background; "incomplete" is not a pass, so a second gate
# (npm run audit:contrast → audit/resolve-contrast-incompletes.mjs) measures
# every flagged element in the live page and fails the build on any real
# WCAG A/AA contrast failure.
#
# Performance is measured but NOT gated (it is host-dependent and noisy); only
# accessibility is a hard gate. See audit/check-audit.mjs.

on:
  push:
    branches: [main]
  # Every pull request, on any target branch: a11y regressions matter on
  # feature branches too, not just merges into main.
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      AUDIT_BASE_URL: http://127.0.0.1:5057
      AUDIT_MIN_A11Y: "100"
      # Coverage contract: these staff pages MUST appear in the audit results,
      # so a silently skipped login pass fails the build instead of passing
      # quiet. The runner logs in via the seeded fixtures + dev OTP.
      AUDIT_EXPECT_AUTHED: worker,admin
    steps:
      - uses: actions/checkout@v4

      - name: Boot the local stack (pgserver + Flask on :5057)
        # Composite action shared with the Playwright workflow: installs
        # Python/Node deps + Chromium and boots pgserver+Flask with seeded
        # fixtures, waiting for readiness.
        id: stack
        uses: ./.github/actions/boot-local-stack
        with:
          browsers: chromium
          export-chrome-path: true

      - name: Run Lighthouse + axe audit and enforce the accessibility gate
        run: |
          set -euo pipefail
          npm run audit
          node audit/check-audit.mjs

      - name: Resolve axe contrast incompletes and enforce the contrast gate
        # Second hard gate: axe "incomplete" contrast results are measured for
        # real in the live page; exit 1 on any FAIL (see
        # audit/resolve-contrast-incompletes.mjs). Reuses the stack and
        # Chromium already booted above.
        run: npm run audit:contrast

      - name: Show local stack log on failure
        if: failure()
        run: tail -n 120 "${{ steps.stack.outputs.stack-log }}"

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-perf-audit
          path: audit/out/
          retention-days: 14
          if-no-files-found: warn

      - name: Stop the local stack
        if: always()
        run: |
          if [ -n "${{ steps.stack.outputs.stack-pid }}" ]; then
            kill "${{ steps.stack.outputs.stack-pid }}" 2>/dev/null || true
          fi
