name: Health digest

# Daily complement to the 15-minute uptime.yml monitor: probes /health and
# emails a digest of the job counters (canary sweeps, relabel harvest, failed /
# dead-lettered) plus the classifier posture to the panchayat inbox. Rs. 0 —
# GitHub Actions + the app's own SMTP account.
#
# Secrets/vars expected (repository or environment level):
#   SMTP_HOST / SMTP_PORT / SMTP_USE_TLS / SMTP_USERNAME / SMTP_PASSWORD
#   DIGEST_FROM, DIGEST_TO (comma-separated recipients)
#
# Exit-code contract (scripts/health_digest.py), surfaced as the workflow's
# final status by the last step:
#   0 healthy, sent        1 degraded, sent
#   2 /health unreachable (failure notice emailed when SMTP is set)
#   3 digest built, email send FAILED
#   4 email SKIPPED — SMTP/DIGEST_* secrets not configured yet (setup state,
#     not a failure) — the run stays green and the digest lands in artifacts.
# Exactly ONE script invocation runs per workflow run — it both builds and
# sends — so a run can never deliver two emails.

on:
  schedule:
    # 02:30 UTC daily = 08:00 IST — lands at the top of the panchayat morning.
    - cron: '30 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: health-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (requests only — no app stack)
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch /health, build digest, email it (single invocation)
        id: run
        env:
          HEALTH_URL: https://smartgarbage.onrender.com/health
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: |
          set +e
          python scripts/health_digest.py --stats-file digest_stats.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0  # status is decided by the final step, after the summary

      - name: Job summary (visible on the workflow run page)
        if: always()
        run: |
          if [ -f digest_email.md ]; then
            cat digest_email.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ /health could not be reached — see log above; the 15-minute uptime monitor should already have opened an issue." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reflect result in workflow status
        if: always()
        run: |
          code="${{ steps.run.outputs.exit_code }}"
          case "$code" in
            0) echo "✅ healthy — digest sent" ;;
            1) echo "::warning::⚠️ /health reports degraded — digest sent; check the numbers"; exit 1 ;;
            2) echo "::error::🚨 /health unreachable — failure notice emailed (if SMTP secrets set); uptime monitor should page too"; exit 1 ;;
            3) echo "::error::✉️ digest built but the email send FAILED — check SMTP_* secrets"; exit 1 ;;
            4) echo "⏭️ email skipped — SMTP_HOST/SMTP_USERNAME/SMTP_PASSWORD/DIGEST_TO secrets not set yet; digest saved to artifacts (add the secrets to start mailing)" ;;
            *) echo "::error::digest script crashed (exit $code)"; exit 1 ;;
          esac

      - name: Upload digest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-digest
          path: |
            digest_stats.json
            digest_email.md
          retention-days: 30
