name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Single Postgres test job: Supabase PostgreSQL is the only supported
  # database backend, so tests run against a real PostgreSQL service
  # container (conftest.py requires
  # TEST_DATABASE_URL, which is only meaningful with Postgres). Test
  # fixtures honor TEST_DATABASE_URL (see tests/conftest.py) and
  # drop/recreate the schema per test for isolation.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Mirror pytest.ini's filterwarnings promotion: the deprecated sqlite3
      # implicit datetime/date adapters (Python 3.12+) must surface as errors
      # even if a step ever bypasses pytest.ini. Message-anchored so unrelated
      # DeprecationWarnings from third-party deps don't fail the build.
      PYTHONWARNINGS: "error:The default datetime adapter is deprecated:DeprecationWarning,error:The default date adapter is deprecated:DeprecationWarning"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run tests against Postgres
        run: |
          # Parallel against the service-container Postgres: each pytest-xdist
          # worker gets its OWN database (tests/conftest.py re-creates
          # sg_test_<worker> in this cluster), so the per-test schema
          # drop/recreate is safe across workers; the per-test timeout still
          # applies so a hang fails fast instead of blocking.
          # NOTE: the repo root must be on sys.path for the app package and its
          # tests (the runner's checkout dir is $GITHUB_WORKSPACE, not the
          # local repo root where the previous run happened to be), so add it
          # explicitly. This is why the earlier alerting tests failed with
          # ModuleNotFoundError in CI but passed locally.
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python -m pytest tests/ --timeout=180 -v
      - name: Verify stateless CSRF path (anonymous consent + feedback)
        run: |
          # Named coverage for the stateless, time-windowed HMAC CSRF path that
          # the CDN-caching design depends on (anonymous visitors get no session
          # cookie, so Flask-WTF's session-bound validation would reject every
          # anonymous POST — /api/consent, /api/feedback, /report). The full
          # suite above already runs these; this explicit step makes a
          # regression to that production-critical path fail loudly BY NAME:
          #   test_consent_endpoint_works_with_csrf_enabled
          #   test_feedback_endpoint_works_with_csrf_enabled
          # (missing header → 400, tampered token → 400, valid token without
          #  any cookie → 200 + row in Postgres)
          python -m pytest tests/test_features.py -n 0 --timeout=180 -v -k "csrf_enabled"
      - name: Verify locmem mail outbox receives mail
        run: |
          # Named coverage for the flask-mailman locmem backend: with
          # MAIL_BACKEND=locmem (pinned in tests/conftest.py), transactional
          # mail — registration verification, admin/worker OTP, and complaint
          # status alerts — must land in the outbox at
          # app.extensions['mailman'].outbox instead of being silently dropped
          # (SMTP is unconfigured in CI, and send_email_via_smtp falls back to
          # flask-mailman for plain-text mail). The full suite runs these; this
          # explicit step makes a regression to the email path fail loudly BY
          # NAME:
          #   test_registration_sends_verification_email
          #   test_admin_login_sends_otp_email
          #   test_complaint_status_change_sends_update_email
          # (each asserts subject, recipient, and body content in the outbox)
          python -m pytest tests/test_features.py -n 0 --timeout=180 -v -k "sends_verification_email or sends_otp_email or sends_update_email"
      - name: Verify homepage heading count stays at the documented 41
        run: |
          # The accessibility statement (accessibility.html) documents 41
          # headings on the homepage (1 h1, 12 h2, 28 numbered h3). A refactor
          # that thins the heading structure below 41 breaks that documented
          # contract and screen-reader heading navigation, so fail loudly BY
          # NAME when the count drops:
          #   test_homepage_heading_count_meets_documented_41
          # (asserts h1+h2+h3 >= 41 on the anonymous homepage render)
          python -m pytest tests/test_features.py -n 0 --timeout=180 -v -k "heading_count"

      - name: Verify templates ship no inline handlers and every inline block is nonced
        run: |
          # Named coverage for the CSP contract the templates must keep:
          # an inline event handler can never be authorised (no nonce applies
          # to on*= attributes) and an inline <script>/<style> without the
          # per-request nonce is silently refused by the browser. Neither
          # breaks a test client, so make a regression fail loudly BY NAME:
          #   test_no_inline_event_handlers
          #   test_inline_scripts_and_styles_carry_the_nonce
          #   test_nonce_always_comes_from_the_per_request_helper
          #   test_no_javascript_urls
          #   test_rendered_page_nonce_matches_its_csp_header
          # (the last one renders a real page and asserts the nonce in the
          # Content-Security-Policy header is the nonce in the markup)
          python -m pytest tests/test_template_csp.py -n 0 --timeout=180 -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install flake8
        run: pip install flake8
      - name: Lint with flake8
        run: |
          # Fatal errors (undefined names, syntax) + the full PEP8 blank-line
          # family (E301-E306) gate the build. Blank-line debt was cleared
          # package-wide so this is green on main.
          flake8 app/ --count --select=E9,F63,F7,F82,E301,E302,E303,E304,E305,E306 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
      # Guard against monolith-era '# SECTION n —' banner comments returning
      # to app/routes/ after a future refactor (see scripts/check_no_section_banners.py).
      - name: Check for monolith-era SECTION banners
        run: |
          python scripts/check_no_section_banners.py
      # Guard against docs drifting out of sync: a broken relative link or a
      # reference to a deleted/renamed guide must fail the build
      # (see scripts/check_doc_links.py).
      - name: Check docs for broken links / deleted-doc references
        run: |
          python scripts/check_doc_links.py
      # Guard against new sqlite3 datetime bindings without the documented
      # adapter recipe (Python 3.12 deprecation; recipe lives in
      # tests/conftest.py — see scripts/check_sqlite_adapters.py).
      - name: Check for unadapted sqlite3 datetime bindings
        run: |
          python scripts/check_sqlite_adapters.py

  # Deploy to a separate Render STAGING service so changes are tested
  # against a real deploy before going live. Trigger: push to `staging` branch.
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render staging deploy
        run: |
          if [ -z "$RENDER_STAGING_HOOK" ]; then
            echo "Set RENDER_STAGING_HOOK secret to your staging deploy hook URL"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_STAGING_HOOK"
    env:
      RENDER_STAGING_HOOK: ${{ secrets.RENDER_STAGING_HOOK }}