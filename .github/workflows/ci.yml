name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: |
          python -m pytest tests/ -v

  # Postgres-parity job: runs the full suite against a real PostgreSQL
  # service container instead of SQLite, so tz/type/constraint differences
  # (case-sensitive LIKE, enforced FKs, timestamp precision, JSON columns)
  # surface in CI before they reach production. Test fixtures honor the
  # TEST_DATABASE_URL env var (see tests/conftest.py) and drop/recreate the
  # schema per test for isolation.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests against Postgres
        run: |
          python -m pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install flake8
        run: pip install flake8
      - name: Lint with flake8
        run: |
          # Fatal errors (undefined names, syntax) + the full PEP8 blank-line
          # family (E301-E306) gate the build. Blank-line debt was cleared
          # package-wide so this is green on main.
          flake8 app/ --count --select=E9,F63,F7,F82,E301,E302,E303,E304,E305,E306 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
      # Guard against monolith-era '# SECTION n —' banner comments returning
      # to app/routes/ after a future refactor (see scripts/check_no_section_banners.py).
      - name: Check for monolith-era SECTION banners
        run: |
          python scripts/check_no_section_banners.py

  # Deploy to a separate Render STAGING service so changes are tested
  # against a real deploy before going live. Trigger: push to `staging` branch.
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    needs: [test, test-postgres, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render staging deploy
        run: |
          if [ -z "$RENDER_STAGING_HOOK" ]; then
            echo "Set RENDER_STAGING_HOOK secret to your staging deploy hook URL"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_STAGING_HOOK"
    env:
      RENDER_STAGING_HOOK: ${{ secrets.RENDER_STAGING_HOOK }}