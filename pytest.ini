[pytest]
# Tests run in parallel (pytest-xdist) with a per-test timeout (pytest-timeout)
# so a genuinely hung test fails with a traceback instead of stalling the whole
# run. Install the plugins via `pip install -r requirements-dev.txt`.
#
# NOTE: parallel is safe against the per-test schema drop/recreate because
# each pytest-xdist worker is pointed at its OWN PostgreSQL database by
# tests/conftest.py (`sg_test_<worker>` in the cluster TEST_DATABASE_URL
# names). Single-process runs (-n 0, used by the named CI verification
# steps) keep the caller-provided TEST_DATABASE_URL as-is.
# Collect from tests/ only: CLI helpers elsewhere in the repo (e.g.
# scripts/test_whatsapp_send.py) share the test_*.py name pattern but are not
# pytest suites — importing them at collection must never run their side
# effects (env loading, network calls).
testpaths = tests
addopts = -n auto --timeout=180

# Promote the deprecated sqlite3 implicit datetime/date adapters to ERRORS so
# the class can never return anywhere in the suite. Python 3.12 deprecates
# binding raw datetime/date objects into sqlite3 (the implicit ISO adapters);
# the suite speaks Postgres, but SQLite still appears in fixture DBs and
# test-harness scripts (e.g. tests/test_weekly_report_script.py, which binds
# the documented replacement recipes at module import). If any code path
# regresses to relying on the deprecated default adapter, these filters turn
# the DeprecationWarning into an exception at the binding site:
#   The default datetime adapter is deprecated as of Python 3.12; ...
#   The default date adapter is deprecated as of Python 3.12; ...
# Message-anchored (not category-wide) so unrelated DeprecationWarnings from
# third-party deps don't fail the build. Mirrored in CI via PYTHONWARNINGS
# (see .github/workflows/ci.yml, .github/workflows/tests.yml) so a run that
# somehow bypasses this ini still fails the same way.
filterwarnings =
    error:The default datetime adapter is deprecated:DeprecationWarning
    error:The default date adapter is deprecated:DeprecationWarning
