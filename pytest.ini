[pytest]
# Tests run in parallel (pytest-xdist) with a per-test timeout (pytest-timeout)
# so a genuinely hung test fails with a traceback instead of stalling the whole
# run. Install the plugins via `pip install -r requirements-dev.txt`.
#
# NOTE: the Postgres parity CI job overrides with `-n 0` — it shares ONE
# database and each test drops/recreates the schema, so it must stay
# sequential (see .github/workflows/ci.yml).
addopts = -n auto --timeout=180
